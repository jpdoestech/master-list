<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users · HRIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body">

<header class="topbar">
  <div class="topbar-brand">
    <span class="seal seal-sm">HR</span>
    <span class="brand-word">Master&nbsp;List</span>
  </div>
  <div class="topbar-search">
    <a href="dashboard.html" class="btn btn-ghost">← Back to dashboard</a>
  </div>
  <div class="topbar-user">
    <span id="role-badge" class="role-badge">—</span>
    <span id="user-email" class="user-email">—</span>
    <button id="logout-btn" class="btn btn-ghost">Sign out</button>
  </div>
</header>

<div class="app-shell users-shell">
  <main class="main">
    <div class="main-toolbar">
      <h2 class="page-title">Users &amp; access</h2>
      <button id="add-user-btn" class="btn btn-primary">+ Add user</button>
    </div>

    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Email</th>
            <th>Role</th>
            <th>Assigned branches</th>
            <th>Status</th>
            <th>Last login</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="user-rows">
          <tr><td colspan="6" class="empty-state">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<!-- Slide-over: Add/edit user -->
<div id="user-panel" class="slideover" hidden>
  <div class="slideover-backdrop" data-close-panel="user-panel"></div>
  <div class="slideover-card">
    <div class="slideover-head">
      <h3 id="user-panel-title">Add user</h3>
      <button class="icon-btn" data-close-panel="user-panel">×</button>
    </div>
    <form id="user-form" class="stacked-form">
      <input type="hidden" id="user-id">

      <label>Email</label>
      <input type="email" id="user-email-input" required>

      <label id="user-password-label">Password</label>
      <input type="password" id="user-password" autocomplete="new-password">
      <p class="field-hint" id="user-password-hint">Minimum 8 characters.</p>

      <label>Role</label>
      <select id="user-role" required>
        <option value="SuperAdmin">Super Admin</option>
        <option value="Admin">Admin</option>
        <option value="Editor">Editor / Manager</option>
        <option value="Viewer">Viewer</option>
        <option value="Commenter">Commenter</option>
      </select>

      <label>Assigned branches</label>
      <div id="branch-checkboxes" class="checkbox-list"></div>
      <label class="inline-checkbox"><input type="checkbox" id="user-all-branches"> Full access to all branches (Super Admin / Admin)</label>

      <label>Status</label>
      <select id="user-status">
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
      </select>

      <p id="user-form-error" class="form-error" hidden></p>

      <div class="slideover-actions">
        <button type="button" class="btn btn-ghost" data-close-panel="user-panel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save user</button>
      </div>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/rbac.js"></script>
<script src="js/users.js"></script>
</body>
</html>
