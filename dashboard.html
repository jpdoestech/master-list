<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employees · HRIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body">

<header class="topbar">
  <div class="topbar-brand">
    <span class="seal seal-sm">HR</span>
    <span class="brand-word">Master&nbsp;List</span>
  </div>
  <div class="topbar-search">
    <input type="search" id="global-search" placeholder="Search by name, position, email…">
  </div>
  <div class="topbar-user">
    <a href="users.html" id="nav-users-link" class="btn btn-ghost" hidden>Users</a>
    <span id="role-badge" class="role-badge">—</span>
    <span id="user-email" class="user-email">—</span>
    <button id="logout-btn" class="btn btn-ghost">Sign out</button>
  </div>
</header>

<div class="app-shell">

  <aside class="rail">
    <div class="rail-header">
      <span>Branches &amp; Clients</span>
      <button id="add-branch-btn" class="icon-btn" title="Add branch" hidden>+</button>
    </div>
    <div id="branch-tree" class="branch-tree">
      <div class="tree-item active" data-branch="" data-client="">
        <span class="tree-dot" style="--dot:#4F46E5"></span> All records
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h2 class="page-title">Employees</h2>
        <p class="page-subtitle" id="page-subtitle">Loading records…</p>
      </div>
      <button id="add-employee-btn" class="btn btn-primary" hidden>+ Add employee</button>
    </div>

    <div id="bulk-bar" class="bulk-bar" hidden>
      <span id="bulk-count">0 selected</span>
      <div class="bulk-bar-actions">
        <button id="bulk-export-btn" class="btn btn-ghost btn-sm">Export CSV</button>
        <button id="bulk-delete-btn" class="btn btn-danger btn-sm" hidden>Mark inactive</button>
        <button id="bulk-clear-btn" class="btn btn-ghost btn-sm">Clear</button>
      </div>
    </div>

    <div class="main-toolbar">
      <div class="filter-group">
        <select id="status-filter">
          <option value="">All statuses</option>
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>
        <span id="scope-label" class="scope-label"></span>
      </div>
      <div class="toolbar-actions">
        <div class="segmented" id="density-toggle">
          <button type="button" data-density="comfortable">Comfortable</button>
          <button type="button" data-density="compact" class="active">Compact</button>
        </div>
        <button id="export-all-btn" class="btn btn-ghost">Export CSV</button>
      </div>
    </div>

    <div class="table-wrap">
      <div class="table-scroll">
        <table class="data-table" id="employee-table">
          <thead>
            <tr>
              <th class="th-checkbox"><input type="checkbox" id="select-all-checkbox"></th>
              <th class="sortable" data-sort="LastName">Name <span class="sort-arrow">▲</span></th>
              <th class="sortable" data-sort="BranchID">Branch <span class="sort-arrow">▲</span></th>
              <th class="sortable" data-sort="ClientID">Client <span class="sort-arrow">▲</span></th>
              <th class="sortable" data-sort="Position">Position <span class="sort-arrow">▲</span></th>
              <th class="sortable" data-sort="EmploymentStatus">Employment status <span class="sort-arrow">▲</span></th>
              <th class="sortable" data-sort="Status">Status <span class="sort-arrow">▲</span></th>
              <th></th>
            </tr>
          </thead>
          <tbody id="employee-rows">
            <tr><td colspan="8" class="empty-state">Loading…</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination-bar">
        <div class="pagination-summary">
          <span id="pagination-summary-text">—</span>
          <label>
            Rows per page
            <select id="page-size-select">
              <option value="10" selected>10</option>
              <option value="25">25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </label>
        </div>
        <div class="pagination-controls" id="pagination-controls"></div>
      </div>
    </div>
  </main>
</div>

<!-- Slide-over: Employee create/edit -->
<div id="employee-panel" class="slideover" hidden>
  <div class="slideover-backdrop" data-close-panel="employee-panel"></div>
  <div class="slideover-card">
    <div class="slideover-head">
      <h3 id="employee-panel-title">Add employee</h3>
      <button class="icon-btn" data-close-panel="employee-panel">×</button>
    </div>
    <form id="employee-form" class="stacked-form">
      <input type="hidden" id="emp-id">

      <div class="form-row">
        <div>
          <label>Branch</label>
          <select id="emp-branch" required></select>
        </div>
        <div>
          <label>Client</label>
          <select id="emp-client" required></select>
        </div>
      </div>

      <div class="form-row">
        <div><label>First name</label><input id="emp-first" required></div>
        <div><label>Middle name</label><input id="emp-middle"></div>
        <div><label>Last name</label><input id="emp-last" required></div>
      </div>

      <div class="form-row">
        <div>
          <label>Gender</label>
          <select id="emp-gender"><option></option><option>Male</option><option>Female</option></select>
        </div>
        <div>
          <label>Civil status</label>
          <select id="emp-civil"><option></option><option>Single</option><option>Married</option><option>Widowed</option><option>Separated</option></select>
        </div>
        <div><label>Date of birth</label><input type="date" id="emp-dob"></div>
      </div>

      <label>Address</label>
      <input id="emp-address">

      <div class="form-row">
        <div><label>Mobile no.</label><input id="emp-mobile"></div>
        <div><label>Email</label><input type="email" id="emp-email"></div>
      </div>

      <div class="form-row">
        <div><label>Position</label><input id="emp-position"></div>
        <div><label>Date hired</label><input type="date" id="emp-datehired"></div>
        <div>
          <label>Employment status</label>
          <select id="emp-empstatus"><option></option><option>Regular</option><option>Probationary</option><option>Contractual</option><option>Project-based</option></select>
        </div>
      </div>

      <div class="form-row">
        <div><label>TIN</label><input id="emp-tin"></div>
        <div><label>SSS / GSIS</label><input id="emp-sss"></div>
      </div>

      <p id="employee-form-error" class="form-error" hidden></p>

      <div class="slideover-actions">
        <button type="button" class="btn btn-ghost" data-close-panel="employee-panel">Cancel</button>
        <button type="submit" id="employee-form-submit" class="btn btn-primary">Save employee</button>
      </div>
    </form>
  </div>
</div>

<!-- Slide-over: Employee detail + comments -->
<div id="detail-panel" class="slideover" hidden>
  <div class="slideover-backdrop" data-close-panel="detail-panel"></div>
  <div class="slideover-card">
    <div class="slideover-head">
      <h3 id="detail-name">—</h3>
      <button class="icon-btn" data-close-panel="detail-panel">×</button>
    </div>
    <div id="detail-body" class="detail-body"></div>

    <div class="comments-section">
      <h4>Comments</h4>
      <div id="comments-list" class="comments-list"></div>
      <form id="comment-form" class="comment-form" hidden>
        <textarea id="comment-text" placeholder="Add a note about this record…" required></textarea>
        <button type="submit" class="btn btn-primary">Post</button>
      </form>
    </div>
  </div>
</div>

<!-- Modal: Add branch / client -->
<div id="org-modal" class="modal" hidden>
  <div class="modal-backdrop" data-close-modal="org-modal"></div>
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="org-modal-title">Add branch</h3>
      <button class="icon-btn" data-close-modal="org-modal">×</button>
    </div>
    <form id="org-form" class="stacked-form">
      <div id="org-branch-field">
        <label>Branch name</label>
        <input id="org-branch-name">
      </div>
      <div id="org-client-fields" hidden>
        <label>Client name</label>
        <input id="org-client-name">
        <label>Belongs to branch</label>
        <select id="org-client-branch"></select>
      </div>
      <p id="org-form-error" class="form-error" hidden></p>
      <div class="slideover-actions">
        <button type="button" class="btn btn-ghost" data-close-modal="org-modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<div id="toast-stack" class="toast-stack"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/rbac.js"></script>
<script src="js/toast.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/employee.js"></script>
</body>
</html>
