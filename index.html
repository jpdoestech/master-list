<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · HRIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

  <div class="auth-shell">
    <aside class="auth-brand">
      <div class="auth-brand-mark">
        <span class="seal">HR</span>
        <span class="brand-word">Master&nbsp;List</span>
      </div>
      <h1 class="auth-headline">The record of who works&nbsp;where.</h1>
      <p class="auth-sub">One ledger for every branch, every client, every employee — scoped to the people who need it.</p>
      <div class="auth-branches-preview">
        <div class="chip" style="--chip-color:#B8863A">Branch</div>
        <div class="chip" style="--chip-color:#2C6E68">Client</div>
        <div class="chip" style="--chip-color:#3E6FA6">Employee</div>
      </div>
    </aside>

    <main class="auth-panel">
      <form id="login-form" class="auth-form" novalidate>
        <h2>Sign in</h2>
        <p class="auth-form-sub">Use the account your Super Admin set up for you.</p>

        <p id="login-error" class="form-error" hidden></p>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username" placeholder="you@company.com">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">

        <button type="submit" id="login-submit" class="btn btn-primary btn-block">Sign in</button>
      </form>
      <p class="auth-footnote">Access is limited to accounts created by your organization's Super Admin.</p>
    </main>
  </div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
